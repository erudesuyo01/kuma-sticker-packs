<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuma Sticker Packs</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/new.css"><link rel="stylesheet" href="css/battle.css"><link rel="stylesheet" href="css/pages.css">
</head><body>
<canvas id="fx"></canvas><div class="flash" id="flash"></div>
<header><h1>Kuma Sticker Packs</h1>
  <nav id="nav"><button class="pill" data-go="dungeon"><span>⚔️</span>Battle</button><button class="pill" data-go="shop"><span>🎁</span>Shop</button><button class="pill" data-go="index"><span>📖</span>Index</button><button class="pill" data-go="deck"><span>🃏</span>Deck</button></nav>
  <div class="hright"><div class="coin" id="coin"></div><button class="pill" id="snd" aria-label="Sound"></button></div></header>
<!-- Shop: pack + reveal markup is the original game's -->
<main class="view" id="view-shop">
  <div class="stage" id="stage"><div class="aura"></div>
    <div class="pack enter" id="pack" role="button" aria-label="Buy and open pack"><img class="bot" id="pb" alt=""><img class="top" id="pt" alt="Sticker pack"></div>
    <div class="reveal" id="reveal"><div class="rays"></div><div class="rays r2"></div><i class="ring"></i><i class="ring b"></i><div class="card" id="card"><img id="stk" alt="Your sticker"><span class="badge" id="badge"></span></div></div>
  </div>
  <div class="info" id="info"></div>
</main>
<section class="view" id="view-dungeon"></section>
<section class="view" id="view-index"></section>
<section class="view" id="view-deck"></section>
<section class="view" id="view-battle"></section>
<script src="js/config.js"></script><script src="js/stickers.js"></script><script src="js/skills.js"></script><script src="js/storage.js"></script>
<script src="js/sfx.js"></script><script src="js/fx.js"></script><script src="js/shop.js"></script>
<script src="js/decks.js"></script><script src="js/cooldowns.js"></script><script src="js/battle-engine.js"></script><script src="js/enemy-ai.js"></script><script src="js/battle-ui.js"></script>
<script src="js/dungeon.js"></script><script src="js/index-page.js"></script><script src="js/deck-builder.js"></script><script src="js/main.js"></script>
</body></html>
